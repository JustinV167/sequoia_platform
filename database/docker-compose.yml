services:
  db:
    image: postgres:16-alpine
    container_name: sequoia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sequoia
      POSTGRES_PASSWORD: sequoia_pass
      POSTGRES_DB: sequoia
    ports:
      - "5432:5432"
    volumes:
      - sequoia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sequoia -d sequoia"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sequoia_net

networks:
  sequoia_net:
    external: true

volumes:
  sequoia_pgdata:
