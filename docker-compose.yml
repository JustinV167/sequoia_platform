services:
  api:
    build:
      context: ./services/sequoia_back
      dockerfile: Dockerfile.dev
    container_name: sequoia_api
    restart: unless-stopped
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      DB_HOST: sequoia_db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-sequoia}"
      DB_PASSWORD: "${DB_PASSWORD:-sequoia_pass}"
      DB_NAME: "${DB_NAME:-sequoia}"
      MONGO_HOST: sequoia_mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-sequoia}"
      DB_SYNCHRONIZE: "${DB_SYNCHRONIZE:-false}"
      DB_MIGRATIONS_RUN: "${DB_MIGRATIONS_RUN:-true}"
      DB_LOGGING: "${DB_LOGGING:-false}"
      PORT: "3001"
      REGISTRATION_TOKEN_SECRET: "${REGISTRATION_TOKEN_SECRET:-dev-registration-secret-change-me}"
      REGISTRATION_TOKEN_TTL_SECONDS: "${REGISTRATION_TOKEN_TTL_SECONDS:-900}"
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret-change-me}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-sequoia_session}"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-7}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      OTP_PEPPER: "${OTP_PEPPER:-dev-otp-pepper-change-me}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      UPLOADS_DIR: "${UPLOADS_DIR:-src/uploads/files}"
      # local guarda en UPLOADS_DIR; supabase usa el bucket configurado.
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_BUCKET: "${SUPABASE_BUCKET:-sequoia}"
      SUPABASE_PUBLIC_BASE_URL: "${SUPABASE_PUBLIC_BASE_URL:-}"
      IMAGE_COMPRESSION_ENABLED: "${IMAGE_COMPRESSION_ENABLED:-true}"
      IMAGE_COMPRESSION_MIN_BYTES: "${IMAGE_COMPRESSION_MIN_BYTES:-51200}"
      IMAGE_COMPRESSION_TIMEOUT_MS: "${IMAGE_COMPRESSION_TIMEOUT_MS:-60000}"
      # h264 = máxima compatibilidad; hevc (H.265) o av1 = máximo ahorro.
      # Con CRF vacío se usa el default de cada códec (18 / 23 / 28).
      VIDEO_COMPRESSION_ENABLED: "${VIDEO_COMPRESSION_ENABLED:-true}"
      VIDEO_COMPRESSION_CODEC: "${VIDEO_COMPRESSION_CODEC:-av1}"
      VIDEO_COMPRESSION_CRF: "${VIDEO_COMPRESSION_CRF:-}"
      VIDEO_COMPRESSION_PRESET: "${VIDEO_COMPRESSION_PRESET:-medium}"
      VIDEO_COMPRESSION_AUDIO_BITRATE: "${VIDEO_COMPRESSION_AUDIO_BITRATE:-128k}"
      VIDEO_COMPRESSION_MIN_BYTES: "${VIDEO_COMPRESSION_MIN_BYTES:-8388608}"
      VIDEO_COMPRESSION_MAX_HEIGHT: "${VIDEO_COMPRESSION_MAX_HEIGHT:-0}"
      VIDEO_COMPRESSION_TIMEOUT_MS: "${VIDEO_COMPRESSION_TIMEOUT_MS:-600000}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-Sequoia <no-reply@sequoia.local>}"
    ports:
      - "3001:3001"
    volumes:
      - ./services/sequoia_back/src:/app/src
    command: npm run start:dev
    networks:
      - sequoia_net

  front:
    build:
      context: ./services/sequoia_front
      dockerfile: Dockerfile.dev
    container_name: sequoia_front
    restart: unless-stopped
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:3001/api}"
    ports:
      - "5173:5173"
    volumes:
      - ./services/sequoia_front/src:/app/src
      - ./services/sequoia_front/index.html:/app/index.html
    networks:
      - sequoia_net

networks:
  sequoia_net:
    external: true
